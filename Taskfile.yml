version: '3'

vars:
  APP_NAME: Lumin
  BIN_DIR: build/bin
  # Dev 模式下跟随 `wails3 dev` 设置的 WAILS_VITE_PORT（默认 9245），
  # 保证 vite 端口与 FRONTEND_DEVSERVER_URL 一致；生产构建仍可用 VITE_PORT=5173 覆盖。
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    dir: frontend
    cmds:
      - npm install

  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    cmds:
      - wails3 generate bindings -f '-tags production' -clean=true

  build:frontend:
    summary: Build the frontend project
    run: once
    dir: frontend
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      - npm run build

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    cmds:
      - task: frontend:dev:npm

  frontend:dev:npm:
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  build:
    summary: Build the application
    deps:
      - task: build:frontend
      - task: generate:syso
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}"
      - cmd: powershell -NoProfile -Command "Remove-Item -Force 'wails_windows_amd64.syso'"
        platforms: [windows]
      - cmd: rm -f wails_windows_amd64.syso
        platforms: [linux, darwin]
    vars:
      # DEV=true（`wails3 dev` 流程传入）时不带 production tag：
      # assetserver 走 build_dev.go，将前端请求代理到 FRONTEND_DEVSERVER_URL（vite 热更新）。
      # 默认 production 构建：-trimpath + strip + Windows 隐藏控制台。
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}}{{end}} -buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -ldflags="-w -s{{if eq OS "windows"}} -H windowsgui{{end}}"{{end}}'

  generate:syso:
    summary: Generate Windows application icon resources
    platforms: [windows]
    dir: build
    cmds:
      - wails3 generate syso -arch amd64 -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_amd64.syso

  run:
    summary: Run the application
    deps:
      - task: build
    cmds:
      - '"./{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}"'

  run:dev:
    summary: Run the application without rebuilding (for `wails3 dev`)
    cmds:
      - '"./{{.BIN_DIR}}/{{.APP_NAME}}{{exeExt}}"'

  generate:icons:
    summary: Generates Windows .ico and Mac .icns from an image
    run: once
    dir: build
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico
