# 依赖验证 CI：负责在 PR/push 上跑构建与测试，验证 dependabot 升级后的依赖
# 是否仍能编译通过。release.yml 只在打 tag 时触发，dependabot PR 走这里。
#
# v3 说明：构建统一走 `wails3 task build`（由 Taskfile 编排：安装前端依赖 ->
# 全量重建 v3 绑定 -> 前端产物 -> Go 编译）。绑定生成是 -clean 重建且前端
# 打包会引用生成的绑定，无法拆开单独执行，必须由 task 按序完成。

name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.26'
  WAILS_VERSION: 'v3.0.0-beta.23'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖（wails3 v3 Linux 默认 GTK4/WebkitGTK6.0 后端，CLI 编译同样需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libglib2.0-dev \
            libc6-dev libayatana-appindicator3-dev

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: 安装前端依赖
        # runner 全局默认走腾讯云 npm 镜像且可能超时；GitHub runner 上用官方源更稳，
        # 并加大重试次数/超时兜底偶发网络抖动
        run: >
          npm ci
          --registry=https://registry.npmjs.org/
          --fetch-retries=5
          --fetch-retry-mintimeout=5000
          --fetch-retry-maxtimeout=120000
        working-directory: frontend

      - name: Wails3 完整构建（生成绑定 + 前端产物 + Go 编译）
        run: |
          export PATH=$HOME/go/bin:$PATH
          wails3 task build

      - name: Go 静态检查
        run: go vet ./...

      - name: Go 测试
        run: go test ./...

      - name: i18n 校验
        run: npm run i18n:check
        working-directory: frontend
